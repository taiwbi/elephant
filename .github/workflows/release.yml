name: Build and release Elephant

on:
  push:
    tags:
      - "*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  BUILD_PLAN: Elephant

  # Pin this so builds are reproducible.
  # Update manually when you want to build against a newer Iosevka.
  IOSEVKA_REF: v34.8.1

  NODE_VERSION: "24"

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    timeout-minutes: 120

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ -z "$tag" ]]; then
            echo "Release tag is empty." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Clone Iosevka
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$IOSEVKA_REF" \
            https://github.com/be5invis/Iosevka.git \
            iosevka

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: iosevka/package-lock.json

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes \
            ttfautohint \
            zip

      - name: Install Iosevka dependencies
        working-directory: iosevka
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Install private build plan
        shell: bash
        run: |
          set -euo pipefail

          cp private-build-plans.toml \
            iosevka/private-build-plans.toml

      - name: Build Elephant
        working-directory: iosevka
        shell: bash
        run: |
          set -euo pipefail

          # Iosevka can use a lot of RAM per concurrent build job.
          # Two jobs is a reasonable limit for a GitHub-hosted runner.
          npm run build -- "contents::$BUILD_PLAN" --jCmd=2

      - name: Show generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated files:"
          find iosevka/dist -type f -print | sort

      - name: Prepare release package
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package release

          # Include everything generated by contents::Elephant:
          # TTF, WOFF2, CSS, etc.
          cp -a iosevka/dist/. package/

          # Include the exact configuration used for this build.
          cp private-build-plans.toml \
            package/private-build-plans.toml

          # Iosevka is distributed under SIL OFL 1.1.
          cp iosevka/LICENSE.md \
            package/LICENSE-Iosevka.md

          cat > package/BUILDINFO.txt <<EOF
          Family: Elephant
          Build plan: $BUILD_PLAN
          Release: $RELEASE_TAG
          Iosevka upstream ref: $IOSEVKA_REF
          Custom repository commit: $GITHUB_SHA
          GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          zip_name="Elephant-${RELEASE_TAG}.zip"
          tar_name="Elephant-${RELEASE_TAG}.tar.gz"

          (
            cd package
            zip -9 -r "../release/$zip_name" .
          )

          tar \
            -C package \
            -czf "release/$tar_name" \
            .

          (
            cd release
            sha256sum \
              "$zip_name" \
              "$tar_name" \
              > SHA256SUMS
          )

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          # Elephant $RELEASE_TAG

          Custom Iosevka build using the \`Elephant\` build plan.

          **Iosevka upstream:** \`$IOSEVKA_REF\`  
          **Build target:** \`contents::$BUILD_PLAN\`  
          **Configuration commit:** \`$GITHUB_SHA\`

          The archives contain the generated TTF/WOFF2/CSS files, the
          \`private-build-plans.toml\` used to build them, build metadata,
          and the Iosevka SIL Open Font License.

          SHA-256 checksums are available in \`SHA256SUMS\`.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists." >&2
            echo "Delete it or create a new tag before rerunning." >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # A tag-triggered build should only release an existing tag.
            gh release create "$RELEASE_TAG" \
              release/* \
              --verify-tag \
              --title "Elephant $RELEASE_TAG" \
              --notes-file release-notes.md
          else
            # A manually dispatched build may create the requested tag.
            # Point it at the exact commit that the workflow was run from.
            gh release create "$RELEASE_TAG" \
              release/* \
              --target "$GITHUB_SHA" \
              --title "Elephant $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
